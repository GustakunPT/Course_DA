name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo ramo cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q tests

  web:
    name: Web (typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:mockups
      - run: npm run test:coverage
      - run: npm run build
      - name: Lighthouse (desempenho, acessibilidade, boas práticas, SEO e limites de tamanho)
        # Os limites estão em web/lighthouserc.json; o Chrome já vem instalado no runner do GitHub.
        timeout-minutes: 10
        run: npm run test:lighthouse
      - name: E2E Smoke (Playwright Chromium, Firefox e WebKit, computador e telemóvel)
        # Instalar os três browsers leva alguns minutos; se o passo passar dos 20, algo ficou pendurado.
        timeout-minutes: 20
        env:
          SMOKE_BROWSERS: chromium,firefox,webkit
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
