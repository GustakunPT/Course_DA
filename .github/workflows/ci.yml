name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo ramo cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q tests

  web:
    name: Web (typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:mockups
      - run: npm run test:coverage
      - run: npm run build
      - name: E2E Smoke (Playwright Chromium)
        # Instalar o Chromium leva ~6 min; se o passo passar dos 15, algo ficou pendurado.
        timeout-minutes: 15
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
          npm run test:e2e
