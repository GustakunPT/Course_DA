      <rect x="85" y="8" width="80" height="16" rx="8" fill="#000000" stroke="#1E293B" stroke-width="0.8" />
      
      <!-- Mini Content -->
      <text x="16" y="42" class="font-mono" font-size="9" font-weight="700" fill="#22C55E">[SYS::SQLITE_WASM]</text>
      <text x="165" y="42" class="font-mono" font-size="8" fill="#F59E0B">[MEM:4.2MB]</text>

      <!-- Mini KPI Strip -->
      <rect x="16" y="52" width="105" height="34" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="0.8" />
      <text x="22" y="66" class="font-mono" font-size="7" fill="#64748B">// RECEITA</text>
      <text x="22" y="78" class="font-mono" font-size="9" font-weight="700" fill="#22C55E">€47.892</text>

      <rect x="129" y="52" width="105" height="34" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="0.8" />
      <text x="135" y="66" class="font-mono" font-size="7" fill="#64748B">// ROWS</text>
      <text x="135" y="78" class="font-mono" font-size="9" font-weight="700" fill="#F8FAFC">5.078</text>

      <!-- Mini Chart -->
      <rect x="16" y="94" width="218" height="58" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="0.8" />
      <polyline points="26,138 60,130 95,120 130,108 175,125 215,115" fill="none" stroke="#22C55E" stroke-width="1.5" />
      <circle cx="130" cy="108" r="2.5" fill="#22C55E" />
      <text x="22" y="106" class="font-mono" font-size="6" fill="#22C55E">HISTOGRAMA_EUR [OUT-MAR]</text>

      <!-- Mini Terminal Query Prompt -->
      <rect x="16" y="160" width="218" height="42" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="0.8" />
      <text x="22" y="174" class="font-mono" font-size="6" fill="#22C55E">&gt; SELECT categoria, sum(total) FROM vendas</text>
      <text x="22" y="188" class="font-mono" font-size="6" fill="#38BDF8">&gt; Padaria: €14.892, Frutaria: €11.230 [OK]</text>

      <!-- Mini Telemetry Bar -->
