      <text x="0" y="32" class="font-sans" font-size="11" fill="#E2E8F0">Azul cósmico (#090D1A), Indigo (#6366F1), Âmbar (#F59E0B), Vidro fosco translúcido.</text>
      
      <!-- Attribute 2: Tipografia -->
