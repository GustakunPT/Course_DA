      <text x="0" y="128" class="font-sans" font-size="11" fill="#E2E8F0">Telemetria de queries em tempo real, métricas de memória/ms, densidade máxima.</text>

      <!-- Attribute 4: Persona -->
      <text x="0" y="160" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">PERFIL DO ALUNO</text>
      <text x="0" y="176" class="font-sans" font-size="11" fill="#E2E8F0">Ambição técnica avançada, mentalidade DataOps e engenharia de dados profissional.</text>

      <!-- Recommendation Tag -->
