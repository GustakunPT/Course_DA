      <text x="48" y="226" class="font-mono" font-size="8" font-weight="700" fill="#000000">[EXECUTE_QUERY :: 11.2ms]</text>

      <!-- Mini Home Bar -->
      <rect x="85" y="266" width="80" height="3" rx="1.5" fill="#22C55E" opacity="0.5" />
