      <text x="0" y="16" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">PALETA &amp; TEMA</text>
      <text x="0" y="32" class="font-sans" font-size="11" fill="#E2E8F0">Neutro quente (#FAFAF9), Obsidiana (#18181B), Sage Suave (#0F766E), Bordas 1px (#E4E4E7).</text>
      
      <!-- Attribute 2: Tipografia -->
      <text x="0" y="64" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">TIPOGRAFIA</text>
      <text x="0" y="80" class="font-sans" font-size="11" fill="#E2E8F0">Host Grotesk editorial + Atkinson Hyperlegible Mono. Generoso respiro vertical.</text>

      <!-- Attribute 3: Ergonomia Touch -->
      <text x="0" y="112" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">ERGONOMIA TOUCH</text>
      <text x="0" y="128" class="font-sans" font-size="11" fill="#E2E8F0">Acordeões expansíveis para eliminar scroll longo. Transição fluida entre leitura e código.</text>

      <!-- Attribute 4: Persona -->
      <text x="0" y="160" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">PERFIL DO ALUNO</text>
      <text x="0" y="176" class="font-sans" font-size="11" fill="#E2E8F0">Sessões de estudo aprofundado, sem fadiga visual, leitura calma e reflexiva.</text>

      <!-- Recommendation Tag -->
      <rect x="0" y="200" width="292" height="28" rx="6" fill="rgba(15, 118, 110, 0.2)" stroke="#0F766E" stroke-width="1" />
      <text x="24" y="218" class="font-sans" font-size="10" font-weight="700" fill="#2DD4BF">★ MELHOR PARA: FOCO &amp; MENOR COGNITIVO</text>
    </g>
  </g>

  <!-- ========================================================================
       COLUMN 2: GLASSMORPHIC / NEO-DUO
       ======================================================================== -->
  <g transform="translate(430, 110)">
    <!-- Column Card Background -->
    <rect width="340" height="640" rx="16" fill="#141923" stroke="#232B3B" stroke-width="1" filter="url(#matrixShadow)" />
    
    <!-- Header Banner -->
    <rect width="340" height="74" rx="16" fill="#1B2230" />
    <rect x="0" y="58" width="340" height="16" fill="#1B2230" />
    <circle cx="36" cy="36" r="16" fill="#6366F1" />
    <text x="30" y="42" font-size="15">✨</text>
    <text x="64" y="32" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">2. Glassmorphic</text>
    <text x="64" y="48" class="font-sans" font-size="11" fill="#94A3B8">Modern Vibrant &amp; Gamified App</text>

