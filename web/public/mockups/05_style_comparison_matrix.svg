        <rect x="20" y="0" width="16" height="16" rx="3" fill="rgba(255,255,255,0.1)" />
        <text x="25" y="11" class="font-mono" font-size="8" fill="#38BDF8">)</text>
        <rect x="40" y="0" width="16" height="16" rx="3" fill="rgba(255,255,255,0.1)" />
        <text x="45" y="11" class="font-mono" font-size="8" fill="#F59E0B">=</text>
