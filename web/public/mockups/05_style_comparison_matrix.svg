<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;display=swap');
      .font-sans { font-family: 'Host Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'Atkinson Hyperlegible Mono', monospace; }
    </style>
    <filter id="matrixShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="1200" height="800" fill="#0A0D14" />

  <!-- Global Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" class="font-sans" font-size="24" font-weight="700" fill="#FFFFFF">Mercearia do Bairro — Matriz Comparativa de Estilos Móveis (R2)</text>
    <text x="0" y="48" class="font-sans" font-size="14" fill="#94A3B8">Exploração estética e ergonómica para a Academia de Analistas de Dados em viewports de 375px a 430px</text>
  </g>

  <!-- ========================================================================
       COLUMN 1: NORDIC STUDIO
       ======================================================================== -->
  <g transform="translate(60, 110)">
    <!-- Column Card Background -->
    <rect width="340" height="640" rx="16" fill="#141923" stroke="#232B3B" stroke-width="1" filter="url(#matrixShadow)" />
    
    <!-- Header Banner -->
    <rect width="340" height="74" rx="16" fill="#1B2230" />
    <rect x="0" y="58" width="340" height="16" fill="#1B2230" />
    <circle cx="36" cy="36" r="16" fill="#0F766E" />
    <text x="30" y="42" font-size="15">🌱</text>
    <text x="64" y="32" class="font-sans" font-size="16" font-weight="700" fill="#FFFFFF">1. Nordic Studio</text>
    <text x="64" y="48" class="font-sans" font-size="11" fill="#94A3B8">Clean Scandinavian Data Studio</text>

    <!-- Mini Mockup Frame Preview -->
    <g transform="translate(45, 90)">
      <!-- Mini Phone Shell -->
      <rect width="250" height="280" rx="20" fill="#FAFAF9" stroke="#E4E4E7" stroke-width="1.5" />
      <!-- Island -->
      <rect x="85" y="8" width="80" height="16" rx="8" fill="#000000" />
      
      <!-- Mini Content -->
      <text x="16" y="42" class="font-sans" font-size="10" font-weight="700" fill="#18181B">Mercearia do Bairro</text>
      <text x="16" y="54" class="font-mono" font-size="8" fill="#0F766E">SQL // ETAPA 04</text>
      
      <!-- Mini Switcher -->
      <rect x="16" y="62" width="218" height="20" rx="4" fill="#F4F4F5" />
      <rect x="18" y="64" width="105" height="16" rx="3" fill="#FFFFFF" />
      <text x="34" y="76" class="font-sans" font-size="7" font-weight="700" fill="#18181B">📖 Lição</text>
      <text x="148" y="76" class="font-sans" font-size="7" fill="#71717A">⚡ Bancada</text>

      <!-- Mini Theory Card -->
      <rect x="16" y="90" width="218" height="54" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.8" />
      <rect x="16" y="90" width="3" height="54" fill="#0F766E" />
      <text x="24" y="104" class="font-sans" font-size="8" font-weight="700" fill="#18181B">Analogia da Mercearia</text>
      <text x="24" y="116" class="font-sans" font-size="7" fill="#52525B">Montes de talões por categoria</text>
      <text x="24" y="126" class="font-sans" font-size="7" fill="#52525B">GROUP BY + SUM(total)</text>

      <!-- Mini Accordion -->
      <rect x="16" y="152" width="218" height="22" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="0.8" />
      <text x="24" y="166" class="font-sans" font-size="7" font-weight="600" fill="#18181B">📋 Tabela de Sintaxe Rápida</text>
      <text x="218" y="166" class="font-sans" font-size="7" fill="#71717A">▼</text>

      <!-- Mini Action Button -->
      <rect x="16" y="184" width="218" height="26" rx="5" fill="#0F766E" />
      <text x="64" y="200" class="font-sans" font-size="8" font-weight="700" fill="#FFFFFF">Praticar na Bancada ➔</text>

      <!-- Mini Home Bar -->
      <rect x="85" y="266" width="80" height="3" rx="1.5" fill="#18181B" opacity="0.4" />
    </g>

