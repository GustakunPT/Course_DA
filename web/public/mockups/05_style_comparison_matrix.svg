      <rect x="16" y="186" width="218" height="48" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" />
      <text x="22" y="198" class="font-mono" font-size="7" font-weight="700" fill="#10B981">✓ 5.078 transações processadas</text>
      <text x="22" y="210" class="font-sans" font-size="7" fill="#CBD5E1">Padaria: €14.892 | Frutaria: €11.230</text>

