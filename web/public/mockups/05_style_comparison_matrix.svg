      <text x="0" y="80" class="font-sans" font-size="11" fill="#E2E8F0">Host Grotesk impactante + JetBrains Mono com syntax highlighting vibrante.</text>

      <!-- Attribute 3: Ergonomia Touch -->
      <text x="0" y="112" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">ERGONOMIA TOUCH</text>
      <text x="0" y="128" class="font-sans" font-size="11" fill="#E2E8F0">Barra de símbolos rápidos touch, feedback vibrante com glowing buttons, badges de streak.</text>

      <!-- Attribute 4: Persona -->
      <text x="0" y="160" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8">PERFIL DO ALUNO</text>
      <text x="0" y="176" class="font-sans" font-size="11" fill="#E2E8F0">Alunos que adoram gamificação, streaks diários, e estética moderna estilo Linear/Duolingo.</text>

      <!-- Recommendation Tag -->
      <rect x="0" y="200" width="292" height="28" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1" />
      <text x="28" y="218" class="font-sans" font-size="10" font-weight="700" fill="#A5B4FC">★ MELHOR PARA: MOTIVAÇÃO &amp; RETENÇÃO</text>
    </g>
  </g>

