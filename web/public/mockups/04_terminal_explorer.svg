    <text x="0" y="0" class="font-mono" font-size="9" font-weight="700" fill="#64748B">FILTER_DIMENSIONS:</text>
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="70" height="24" rx="3" fill="#22C55E" />
      <text x="8" y="16" class="font-mono" font-size="9" font-weight="700" fill="#000000">[ALL: 5078]</text>

      <rect x="76" y="0" width="84" height="24" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
      <text x="82" y="16" class="font-mono" font-size="9" font-weight="500" fill="#94A3B8">[PADARIA:1842]</text>

      <rect x="166" y="0" width="88" height="24" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
      <text x="172" y="16" class="font-mono" font-size="9" font-weight="500" fill="#94A3B8">[FRUTARIA:1410]</text>

      <rect x="260" y="0" width="93" height="24" rx="3" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
      <text x="266" y="16" class="font-mono" font-size="9" font-weight="500" fill="#94A3B8">[LATICÍNIOS:986]</text>
    </g>
  </g>

  <!-- Terminal Revenue Curve Graph -->
  <g transform="translate(20, 296)">
    <rect width="353" height="150" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="12" y="20" class="font-mono" font-size="10" font-weight="700" fill="#22C55E">HISTOGRAMA_RECEITA::MENSAL_EUR</text>
    <text x="280" y="20" class="font-mono" font-size="9" fill="#64748B">[OUT-MAR]</text>
    
    <!-- Grid -->
    <line x1="20" y1="40" x2="333" y2="40" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="20" y1="75" x2="333" y2="75" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="20" y1="110" x2="333" y2="110" stroke="#1E293B" stroke-width="1" />

    <!-- Phosphor Area -->
