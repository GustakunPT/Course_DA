    <text x="225" y="18" class="font-mono" font-size="9" font-weight="700" fill="#64748B">CATEGORY</text>
    <text x="305" y="18" class="font-mono" font-size="9" font-weight="700" fill="#64748B">TOTAL</text>

    <!-- Row 1 -->
