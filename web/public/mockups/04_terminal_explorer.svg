    <text x="172" y="38" class="font-mono" font-size="8" font-weight="700" fill="#000000">PEAK:€11.2k</text>

    <!-- X Axis Ticks -->
    <text x="30" y="125" class="font-mono" font-size="8" fill="#64748B" text-anchor="middle">OUT</text>
    <text x="85" y="125" class="font-mono" font-size="8" fill="#64748B" text-anchor="middle">NOV</text>
    <text x="140" y="125" class="font-mono" font-size="8" fill="#64748B" text-anchor="middle">DEZ</text>
    <text x="195" y="125" class="font-mono" font-size="8" font-weight="700" fill="#22C55E" text-anchor="middle">JAN</text>
    <text x="250" y="125" class="font-mono" font-size="8" fill="#64748B" text-anchor="middle">FEV</text>
    <text x="310" y="125" class="font-mono" font-size="8" fill="#64748B" text-anchor="middle">MAR</text>
  </g>

