    <circle cx="85" cy="85" r="3" fill="#22C55E" />
    <circle cx="140" cy="65" r="3" fill="#22C55E" />
    <circle cx="195" cy="45" r="4" fill="#000000" stroke="#22C55E" stroke-width="2" />
    <circle cx="250" cy="80" r="3" fill="#22C55E" />
    <circle cx="310" cy="60" r="3" fill="#22C55E" />

    <!-- Peak Label -->
