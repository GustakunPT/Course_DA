    </g>
    <line x1="10" y1="52" x2="343" y2="52" stroke="#1E293B" stroke-width="0.8" />

    <!-- Row 2 -->
    <g transform="translate(10, 68)" class="font-mono" font-size="9">
      <text x="0" y="0" fill="#38BDF8">#V0002</text>
      <text x="50" y="0" fill="#94A3B8">2024-01-02</text>
      <text x="125" y="0" fill="#F8FAFC">J. Santos</text>
      <text x="215" y="0" fill="#F59E0B">Laticínios</text>
      <text x="295" y="0" font-weight="700" fill="#22C55E">€ 6,80</text>
    </g>
    <line x1="10" y1="76" x2="343" y2="76" stroke="#1E293B" stroke-width="0.8" />

    <!-- Row 3 -->
    <g transform="translate(10, 92)" class="font-mono" font-size="9">
      <text x="0" y="0" fill="#38BDF8">#V0003</text>
      <text x="50" y="0" fill="#94A3B8">2024-01-03</text>
      <text x="125" y="0" fill="#F8FAFC">A. Pereira</text>
      <text x="215" y="0" fill="#F59E0B">Frutaria</text>
      <text x="295" y="0" font-weight="700" fill="#22C55E">€ 4,20</text>
    </g>
    <line x1="10" y1="100" x2="343" y2="100" stroke="#1E293B" stroke-width="0.8" />

    <!-- Row 4 -->
    <g transform="translate(10, 116)" class="font-mono" font-size="9">
      <text x="0" y="0" fill="#38BDF8">#V0004</text>
      <text x="50" y="0" fill="#94A3B8">2024-01-03</text>
      <text x="125" y="0" fill="#F8FAFC">C. Sousa</text>
      <text x="215" y="0" fill="#F59E0B">Padaria</text>
      <text x="295" y="0" font-weight="700" fill="#22C55E">€ 1,80</text>
    </g>
    <line x1="10" y1="124" x2="343" y2="124" stroke="#1E293B" stroke-width="0.8" />

    <!-- Row 5 -->
    <g transform="translate(10, 140)" class="font-mono" font-size="9">
      <text x="0" y="0" fill="#38BDF8">#V0005</text>
      <text x="50" y="0" fill="#94A3B8">2024-01-04</text>
      <text x="125" y="0" fill="#F8FAFC">T. Ramos</text>
      <text x="215" y="0" fill="#F59E0B">Mercearia</text>
      <text x="295" y="0" font-weight="700" fill="#22C55E">€ 5,10</text>
    </g>

    <!-- Telemetry Prompt line -->
    <rect x="10" y="156" width="333" height="26" rx="3" fill="#141B26" stroke="#1E293B" stroke-width="0.8" />
    <text x="18" y="172" class="font-mono" font-size="9" fill="#22C55E">&gt; SELECT count(*) FROM vendas WHERE categoria='Padaria' =&gt; 1842 rows</text>
    
    <text x="10" y="200" class="font-mono" font-size="8" fill="#64748B">// SWIPE_HORIZONTALLY_FOR_COLUMN_SCHEMA [10 COLUMNS CACHED]</text>
  </g>

  <!-- Style Watermark -->
  <g transform="translate(20, 700)">
    <rect width="353" height="42" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="18" class="font-mono" font-size="10" font-weight="700" fill="#22C55E">ESTILO 3: TERMINAL PRO / DATAOPS</text>
    <text x="14" y="32" class="font-mono" font-size="9" fill="#94A3B8">Preto OLED puro, verde fósforo, telemetria de queries em tempo real.</text>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="129" y="833" width="135" height="5" rx="2.5" fill="#22C55E" opacity="0.6" />
</svg>
