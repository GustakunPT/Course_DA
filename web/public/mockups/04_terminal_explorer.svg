<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&amp;display=swap');
      .font-mono { font-family: 'Atkinson Hyperlegible Mono', monospace; }
    </style>
    <pattern id="termGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep OLED Black Background -->
  <rect width="393" height="852" fill="#05070A" />
  <rect width="393" height="852" fill="url(#termGrid)" />

  <!-- Hardware Frame: Subtle Monospaced Frame -->
  <rect x="0.5" y="0.5" width="392" height="851" rx="48" fill="none" stroke="#1E293B" stroke-width="1.2" />

  <!-- Dynamic Island -->
  <rect x="142" y="11" width="109" height="28" rx="14" fill="#000000" stroke="#1E293B" stroke-width="0.8" />
  <circle cx="233" cy="25" r="4.5" fill="#0F172A" stroke="#22C55E" stroke-width="0.5" />

  <!-- Status Bar: Pure Green Phosphor Telemetry -->
  <text x="32" y="30" class="font-mono" font-size="12" font-weight="700" fill="#22C55E">09:41_UTC</text>
  <g transform="translate(305, 18)" fill="#22C55E" class="font-mono" font-size="10" font-weight="700">
    <text x="0" y="11">[NET::5G]</text>
    <text x="50" y="11">[BAT::100%]</text>
  </g>

  <!-- Terminal Header Strip -->
  <g transform="translate(20, 54)">
    <rect width="353" height="34" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="12" y="21" class="font-mono" font-size="11" font-weight="700" fill="#22C55E">[TELEMETRY::VENDAS.CSV]</text>
    <rect x="238" y="7" width="105" height="20" rx="3" fill="#141B26" stroke="#22C55E" stroke-width="0.8" />
    <text x="246" y="21" class="font-mono" font-size="9" font-weight="700" fill="#22C55E">INTEGRITY: 100%</text>
  </g>

  <!-- 2x2 KPI Telemetry Grid -->
  <g transform="translate(20, 98)">
    <!-- KPI 1: Receita -->
    <rect x="0" y="0" width="172" height="68" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#64748B">// RECEITA TOTAL</text>
    <text x="10" y="42" class="font-mono" font-size="17" font-weight="700" fill="#22C55E">€ 47.892,00</text>
    <text x="10" y="58" class="font-mono" font-size="9" fill="#38BDF8">▲ +8.4% [M-1]</text>

    <!-- KPI 2: Transações -->
    <rect x="181" y="0" width="172" height="68" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="191" y="18" class="font-mono" font-size="9" font-weight="700" fill="#64748B">// TRANSAÇÕES</text>
    <text x="191" y="42" class="font-mono" font-size="17" font-weight="700" fill="#F8FAFC">5.078</text>
    <text x="191" y="58" class="font-mono" font-size="9" fill="#22C55E">▲ +340 RECS</text>

    <!-- KPI 3: Ticket Médio -->
    <rect x="0" y="76" width="172" height="68" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="10" y="94" class="font-mono" font-size="9" font-weight="700" fill="#64748B">// TICKET MÉDIO</text>
    <text x="10" y="118" class="font-mono" font-size="17" font-weight="700" fill="#F8FAFC">€ 9,43</text>
    <text x="10" y="134" class="font-mono" font-size="9" fill="#F59E0B">STD: ±€2.10</text>

    <!-- KPI 4: Clientes -->
    <rect x="181" y="76" width="172" height="68" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />
    <text x="191" y="94" class="font-mono" font-size="9" font-weight="700" fill="#64748B">// CLIENTES BASE</text>
    <text x="191" y="118" class="font-mono" font-size="17" font-weight="700" fill="#F8FAFC">120</text>
    <text x="191" y="134" class="font-mono" font-size="9" fill="#22C55E">92% RETENÇÃO</text>
  </g>

