  <g transform="translate(20, 670)">
    <rect width="353" height="58" rx="8" fill="#FAFAF9" stroke="#E4E4E7" stroke-width="1" />
    <rect x="12" y="13" width="50" height="20" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="18" y="27" class="font-mono" font-size="10" font-weight="700" fill="#71717A">SQL:06</text>
    
    <text x="70" y="24" class="font-sans" font-size="12" font-weight="500" fill="#52525B">INNER JOIN e LEFT JOIN</text>
    <text x="70" y="38" class="font-sans" font-size="10" fill="#A1A1AA">12 min • Cruzar produtos e vendas</text>
    
    <circle cx="330" cy="29" r="8" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1" />
    <text x="328" y="32" class="font-sans" font-size="9" fill="#71717A">🔓</text>
  </g>

  <!-- Style Watermark -->
  <g transform="translate(20, 748)">
    <rect width="353" height="42" rx="6" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="14" y="18" class="font-sans" font-size="10" font-weight="700" fill="#18181B">ESTILO 1: NORDIC STUDIO</text>
    <text x="14" y="32" class="font-sans" font-size="9" fill="#71717A">Linhas finas 1px, tipografia Host Grotesk, ausência de ruído visual.</text>
