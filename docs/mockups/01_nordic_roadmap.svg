    <text x="70" y="24" class="font-sans" font-size="12" font-weight="600" fill="#18181B">SELECT, DISTINCT e LIMIT</text>
    <text x="70" y="38" class="font-sans" font-size="10" fill="#71717A">6 min • Exploração inicial de tabelas</text>
    
