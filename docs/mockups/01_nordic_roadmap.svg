  <g transform="translate(20, 246)">
    <rect width="353" height="74" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#cardShadow)" />
    <text x="14" y="20" class="font-mono" font-size="10" font-weight="700" fill="#0F766E">TRILHA 2 // 10 ETAPAS</text>
    <rect x="252" y="10" width="87" height="18" rx="4" fill="#CCFBF1" />
    <text x="258" y="23" class="font-sans" font-size="10" font-weight="700" fill="#115E59">SQLite WASM</text>

