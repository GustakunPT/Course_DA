    <text x="10" y="28" class="font-sans" font-size="11" font-weight="500" fill="#52525B">1. Python</text>

    <!-- Chip 2: SQL (Active) -->
    <rect x="82" y="10" width="78" height="28" rx="6" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.2" />
    <text x="92" y="28" class="font-sans" font-size="11" font-weight="700" fill="#0F766E">2. SQL (10)</text>

    <!-- Chip 3: Pandas -->
    <rect x="166" y="10" width="72" height="28" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
    <text x="176" y="28" class="font-sans" font-size="11" font-weight="500" fill="#52525B">3. Pandas</text>

    <!-- Chip 4: Git -->
    <rect x="244" y="10" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
    <text x="254" y="28" class="font-sans" font-size="11" font-weight="500" fill="#52525B">4. Git</text>

    <!-- Chip 5: BI (Truncated peek) -->
    <rect x="310" y="10" width="43" height="28" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
    <text x="318" y="28" class="font-sans" font-size="11" font-weight="500" fill="#52525B">5. BI</text>
  </g>

