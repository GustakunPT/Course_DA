  <!-- Lesson 1: SQL:01 (Completed) -->
  <g transform="translate(20, 332)">
    <rect width="353" height="58" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
    <rect x="12" y="13" width="50" height="20" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
