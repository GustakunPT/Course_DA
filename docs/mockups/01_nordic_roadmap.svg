  <g transform="translate(20, 398)">
    <rect width="353" height="58" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
    <rect x="12" y="13" width="50" height="20" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="18" y="27" class="font-mono" font-size="10" font-weight="700" fill="#0F766E">SQL:02</text>
    
    <text x="70" y="24" class="font-sans" font-size="12" font-weight="600" fill="#18181B">WHERE, IN, BETWEEN e LIKE</text>
    <text x="70" y="38" class="font-sans" font-size="10" fill="#71717A">8 min • Filtros condicionais em clientes</text>
    
    <circle cx="330" cy="29" r="9" fill="#DCFCE7" />
    <path d="M326 29l3 3 5-5" fill="none" stroke="#15803D" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Lesson 3: SQL:03 (Completed) -->
  <g transform="translate(20, 464)">
    <rect width="353" height="58" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" />
    <rect x="12" y="13" width="50" height="20" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="18" y="27" class="font-mono" font-size="10" font-weight="700" fill="#0F766E">SQL:03</text>
    
    <text x="70" y="24" class="font-sans" font-size="12" font-weight="600" fill="#18181B">ORDER BY e colunas com AS</text>
    <text x="70" y="38" class="font-sans" font-size="10" fill="#71717A">8 min • Ordenação e renomeação de cálculo</text>
    
    <circle cx="330" cy="29" r="9" fill="#DCFCE7" />
    <path d="M326 29l3 3 5-5" fill="none" stroke="#15803D" stroke-width="1.8" stroke-linecap="round" />
  </g>

