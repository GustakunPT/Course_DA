    <text x="30" y="14" class="font-sans" font-size="15" font-weight="700" fill="#18181B">Mercearia do Bairro</text>
    <text x="30" y="27" class="font-sans" font-size="11" font-weight="500" fill="#71717A">Academia de Analistas de Dados</text>

    <!-- Streak Badge & Progress -->
    <rect x="236" y="5" width="62" height="22" rx="11" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
    <text x="244" y="20" class="font-sans" font-size="11" font-weight="700" fill="#B45309">🔥 14 d</text>
    <text x="312" y="21" class="font-sans" font-size="12" font-weight="700" fill="#0F766E">14/47</text>
  </g>

  <!-- Divider Line -->
  <line x1="20" y1="96" x2="373" y2="96" stroke="#E4E4E7" stroke-width="1" />

  <!-- Progress Overview Card -->
  <g transform="translate(20, 108)">
