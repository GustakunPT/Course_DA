<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;display=swap');
      .font-sans { font-family: 'Host Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'Atkinson Hyperlegible Mono', monospace; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background Canvas: Nordic Paper Minimalist -->
  <rect width="393" height="852" fill="#FAFAF9" />

  <!-- Hardware Frame: Subtle Outer Device Border -->
  <rect x="0.5" y="0.5" width="392" height="851" rx="48" fill="none" stroke="#E4E4E7" stroke-width="1" />

  <!-- Dynamic Island -->
  <rect x="142" y="11" width="109" height="28" rx="14" fill="#000000" />
  <circle cx="233" cy="25" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="0.5" />

  <!-- Status Bar -->
  <text x="32" y="30" class="font-sans" font-size="13" font-weight="600" fill="#18181B">09:41</text>
  <g transform="translate(325, 18)" fill="#18181B">
    <!-- Signal, Wifi, Battery -->
    <path d="M1 9h2v3H1zm4-2h2v5H5zm4-3h2v8H9zm4-3h2v11h-2z" />
    <path d="M22 2a10 10 0 0 0-7 2.9l1.4 1.4A8 8 0 0 1 22 4a8 8 0 0 1 5.6 2.3l1.4-1.4A10 10 0 0 0 22 2zm0 4a6 6 0 0 0-4.2 1.8l1.4 1.4A4 4 0 0 1 22 8a4 4 0 0 1 2.8 1.2l1.4-1.4A6 6 0 0 0 22 6zm0 4a2 2 0 0 0-1.4.6l1.4 1.4 1.4-1.4A2 2 0 0 0 22 10z" transform="translate(6, -2)" />
    <rect x="36" y="2" width="18" height="9" rx="2" fill="none" stroke="#18181B" stroke-width="1" />
    <rect x="38" y="4" width="13" height="5" rx="1" fill="#18181B" />
    <path d="M55 5v3a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
  </g>

  <!-- Mobile App Header -->
  <g transform="translate(20, 56)">
