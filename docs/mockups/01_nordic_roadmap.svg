    <text x="70" y="24" class="font-sans" font-size="12" font-weight="700" fill="#18181B">GROUP BY e Agregações</text>
    <text x="70" y="38" class="font-sans" font-size="10" fill="#0F766E" font-weight="600">8 min • Faturar por categoria na mercearia</text>
    
