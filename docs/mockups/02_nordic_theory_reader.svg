<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&amp;family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;display=swap');
      .font-sans { font-family: 'Host Grotesk', -apple-system, sans-serif; }
      .font-mono { font-family: 'Atkinson Hyperlegible Mono', monospace; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Background Canvas: Nordic Paper Minimalist -->
  <rect width="393" height="852" fill="#FAFAF9" />

  <!-- Hardware Frame: Subtle Outer Device Border -->
  <rect x="0.5" y="0.5" width="392" height="851" rx="48" fill="none" stroke="#E4E4E7" stroke-width="1" />

  <!-- Dynamic Island -->
  <rect x="142" y="11" width="109" height="28" rx="14" fill="#000000" />
  <circle cx="233" cy="25" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="0.5" />

  <!-- Status Bar -->
  <text x="32" y="30" class="font-sans" font-size="13" font-weight="600" fill="#18181B">09:41</text>
  <g transform="translate(325, 18)" fill="#18181B">
    <path d="M1 9h2v3H1zm4-2h2v5H5zm4-3h2v8H9zm4-3h2v11h-2z" />
    <path d="M22 2a10 10 0 0 0-7 2.9l1.4 1.4A8 8 0 0 1 22 4a8 8 0 0 1 5.6 2.3l1.4-1.4A10 10 0 0 0 22 2zm0 4a6 6 0 0 0-4.2 1.8l1.4 1.4A4 4 0 0 1 22 8a4 4 0 0 1 2.8 1.2l1.4-1.4A6 6 0 0 0 22 6zm0 4a2 2 0 0 0-1.4.6l1.4 1.4 1.4-1.4A2 2 0 0 0 22 10z" transform="translate(6, -2)" />
    <rect x="36" y="2" width="18" height="9" rx="2" fill="none" stroke="#18181B" stroke-width="1" />
    <rect x="38" y="4" width="13" height="5" rx="1" fill="#18181B" />
  </g>

  <!-- Segmented View Switcher: [ Lição ] ↔ [ Bancada ] -->
  <g transform="translate(20, 54)">
    <rect width="353" height="38" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <!-- Active Button: Lição & Teoria -->
    <rect x="3" y="3" width="173" height="32" rx="6" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#cardShadow)" />
    <text x="38" y="23" class="font-sans" font-size="12" font-weight="700" fill="#18181B">📖 Lição &amp; Teoria</text>
    <!-- Inactive Button: Bancada Prática -->
    <text x="214" y="23" class="font-sans" font-size="12" font-weight="500" fill="#71717A">⚡ Bancada Prática</text>
  </g>

  <!-- Lesson Title & Meta Card -->
  <g transform="translate(20, 104)">
    <rect width="353" height="96" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#cardShadow)" />
    <text x="14" y="20" class="font-mono" font-size="10" font-weight="700" fill="#0F766E">SQL // ETAPA 04</text>
    <text x="250" y="20" class="font-sans" font-size="10" fill="#71717A">⏱️ 8 min • Intermédio</text>
    
    <text x="14" y="42" class="font-sans" font-size="14" font-weight="700" fill="#18181B">GROUP BY e Agregações: Faturar</text>
    <text x="14" y="58" class="font-sans" font-size="14" font-weight="700" fill="#18181B">por Categoria na Mercearia</text>
    
    <text x="14" y="78" class="font-sans" font-size="11" fill="#52525B">Como sintetizar 5.078 talões avulsos em totais por secção comercial.</text>
  </g>

  <!-- Real Grocery Analogy Card ("Analogia da Mercearia") -->
  <g transform="translate(20, 212)">
    <rect width="353" height="114" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="4" height="114" rx="2" fill="#0F766E" />
    
    <text x="14" y="22" font-size="14">🥖</text>
    <text x="34" y="21" class="font-sans" font-size="12" font-weight="700" fill="#18181B">Analogia da Mercearia: Montes de Talões</text>
    
    <text x="14" y="42" class="font-sans" font-size="11" fill="#52525B">Ao fechar a caixa à noite com 5.078 talões espalhados, não</text>
    <text x="14" y="58" class="font-sans" font-size="11" fill="#52525B">somamos talão a talão se quisermos saber as vendas da Padaria.</text>
    <text x="14" y="74" class="font-sans" font-size="11" fill="#52525B">Primeiro separamos em <tspan font-weight="700" fill="#0F766E">montes por categoria</tspan> (o <tspan font-family="monospace">GROUP BY</tspan>).</text>
    <text x="14" y="90" class="font-sans" font-size="11" fill="#52525B">Depois somamos o valor de cada monte (o <tspan font-family="monospace">SUM(total)</tspan>).</text>
  </g>

  <!-- Core Concepts Card -->
  <g transform="translate(20, 338)">
    <rect width="353" height="108" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#cardShadow)" />
    <text x="14" y="22" class="font-sans" font-size="12" font-weight="700" fill="#18181B">Conceitos Fundamentais de Agregação</text>
    
    <circle cx="20" cy="40" r="2.5" fill="#0F766E" />
    <text x="30" y="43" class="font-sans" font-size="11" fill="#18181B"><tspan font-family="monospace" font-weight="700">COUNT(*)</tspan>: Número de pedidos por secção da loja.</text>
    
    <circle cx="20" cy="58" r="2.5" fill="#0F766E" />
    <text x="30" y="61" class="font-sans" font-size="11" fill="#18181B"><tspan font-family="monospace" font-weight="700">SUM(total)</tspan>: Receita monetária faturada em Euros.</text>

    <circle cx="20" cy="76" r="2.5" fill="#0F766E" />
    <text x="30" y="79" class="font-sans" font-size="11" fill="#18181B"><tspan font-family="monospace" font-weight="700">AVG(total)</tspan>: Ticket médio por compra na categoria.</text>

    <circle cx="20" cy="94" r="2.5" fill="#0F766E" />
    <text x="30" y="97" class="font-sans" font-size="11" fill="#18181B"><tspan font-family="monospace" font-weight="700">AS alias</tspan>: Nome limpo para a coluna no relatório da direção.</text>
  </g>

  <!-- Expandable Accordion 1: Syntax Table -->
  <g transform="translate(20, 458)">
    <rect width="353" height="40" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="14" y="25" class="font-sans" font-size="12" font-weight="600" fill="#18181B">📋 Tabela de Sintaxe Rápida</text>
    <text x="328" y="25" class="font-sans" font-size="10" fill="#71717A">▼</text>
  </g>

  <!-- Expandable Accordion 2: Pitfall -->
  <g transform="translate(20, 506)">
    <rect width="353" height="40" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="14" y="25" class="font-sans" font-size="12" font-weight="600" fill="#18181B">⚠️ Armadilha Comum em Entrevistas</text>
    <text x="328" y="25" class="font-sans" font-size="10" fill="#71717A">▼</text>
  </g>

  <!-- Expandable Accordion 3: Pro Practice -->
  <g transform="translate(20, 554)">
    <rect width="353" height="40" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="14" y="25" class="font-sans" font-size="12" font-weight="600" fill="#18181B">💡 Prática Profissional (ROUND e Aliases)</text>
    <text x="328" y="25" class="font-sans" font-size="10" fill="#71717A">▼</text>
  </g>

  <!-- Quick Quiz Card -->
  <g transform="translate(20, 606)">
    <rect width="353" height="136" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1" filter="url(#cardShadow)" />
    <text x="14" y="22" class="font-sans" font-size="11" font-weight="700" fill="#18181B">❓ Verificação Rápida de Conhecimento</text>
    <text x="14" y="38" class="font-sans" font-size="11" fill="#52525B">Qual função calcula a receita monetária total da secção?</text>
    
    <!-- Option A -->
    <rect x="14" y="48" width="158" height="32" rx="6" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="24" y="68" class="font-sans" font-size="11" fill="#52525B">A) COUNT(total)</text>

    <!-- Option B (Correct) -->
    <rect x="180" y="48" width="158" height="32" rx="6" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2" />
    <text x="190" y="68" class="font-sans" font-size="11" font-weight="700" fill="#15803D">B) SUM(total) ✓</text>

    <!-- Option C -->
    <rect x="14" y="88" width="158" height="32" rx="6" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="24" y="108" class="font-sans" font-size="11" fill="#52525B">C) AVG(total)</text>

    <!-- Option D -->
    <rect x="180" y="88" width="158" height="32" rx="6" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="190" y="108" class="font-sans" font-size="11" fill="#52525B">D) MAX(total)</text>
  </g>

  <!-- Sticky Run / Next Action Button -->
  <g transform="translate(20, 754)">
    <rect width="353" height="46" rx="8" fill="#0F766E" />
    <text x="82" y="28" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">Praticar na Bancada Interativa ➔</text>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="129" y="833" width="135" height="5" rx="2.5" fill="#18181B" opacity="0.6" />
</svg>
